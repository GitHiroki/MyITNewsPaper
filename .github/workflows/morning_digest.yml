name: Morning News Digest

on:
  schedule:
    # 毎朝 07:00 JST (= UTC 22:00 前日)
    - cron: "0 22 * * *"
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを防ぐ（前のジョブが終わってから次を実行）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # --- ① ニュース取得 → HTML生成 → アーティファクトとしてアップロード ---
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest HTML
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: exit 1 # ★検証用：build を強制失敗させる（API課金なし）。確認後に revert する

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .   # index.html があるディレクトリ

  # --- ② GitHub Pages にデプロイ ---
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"📰 朝のニュースダイジェストが更新されました\n${{ steps.deployment.outputs.page_url }}\"}"

  # --- ③ build / deploy のいずれかが失敗したら Slack 通知 ---
  notify-failure:
    needs: [build, deploy]
    if: failure() # いずれかの needs が失敗したときのみ実行
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack (failure)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"❌ 朝のニュースダイジェストの生成に失敗しました\nワークフローを確認してください: ${RUN_URL}\"}"