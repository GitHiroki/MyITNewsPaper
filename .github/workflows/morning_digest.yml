name: Morning News Digest

on:
  schedule:
    # 毎朝 07:00 JST (= UTC 22:00 前日)
    - cron: "0 22 * * *"
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを防ぐ（前のジョブが終わってから次を実行）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # --- ① ニュース取得 → HTML生成 → アーティファクトとしてアップロード ---
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # サマリ生成の結果を deploy ジョブへ渡す（status: ok | degraded | fatal）
    outputs:
      status: ${{ steps.digest.outputs.status }}
      reason: ${{ steps.digest.outputs.reason }}
      ok_sources: ${{ steps.digest.outputs.ok_sources }}
      total_sources: ${{ steps.digest.outputs.total_sources }}
      failed_sources: ${{ steps.digest.outputs.failed_sources }}
      # Jev の選別結果（disabled | ok | degraded）と判定件数
      jev_status: ${{ steps.digest.outputs.jev_status }}
      jev_scored: ${{ steps.digest.outputs.jev_scored }}
      jev_failed: ${{ steps.digest.outputs.jev_failed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest HTML
        id: digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 未設定なら Jev の選別はスキップされ、従来どおり動く
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python main.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public   # main.py が index.html を書き出すディレクトリ。ここだけを公開する

  # --- ② GitHub Pages にデプロイ ---
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # サマリ生成が劣化していた場合は ⚠️ 版に差し替えて原因を本文に載せる
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ needs.build.outputs.status }}
          REASON: ${{ needs.build.outputs.reason }}
          OK_SOURCES: ${{ needs.build.outputs.ok_sources }}
          TOTAL_SOURCES: ${{ needs.build.outputs.total_sources }}
          FAILED_SOURCES: ${{ needs.build.outputs.failed_sources }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JEV_STATUS: ${{ needs.build.outputs.jev_status }}
          JEV_SCORED: ${{ needs.build.outputs.jev_scored }}
          JEV_FAILED: ${{ needs.build.outputs.jev_failed }}
        run: |
          set -euo pipefail
          case "${STATUS:-}" in
            ok)
              TEXT="📰 朝のニュースダイジェストが更新されました
          ${PAGE_URL}"
              ;;
            fatal)
              TEXT="⚠️ サマリを生成できませんでした（${OK_SOURCES}/${TOTAL_SOURCES} ソース）: ${REASON}
          記事のタイトルとリンクのみのページを公開しています。
          ページ: ${PAGE_URL}
          run: ${RUN_URL}"
              ;;
            degraded)
              TEXT="⚠️ 一部のソースでサマリを生成できませんでした（${OK_SOURCES}/${TOTAL_SOURCES} ソース）: ${REASON}
          失敗したソース: ${FAILED_SOURCES}
          ページ: ${PAGE_URL}
          run: ${RUN_URL}"
              ;;
            *)
              TEXT="⚠️ サマリ生成の結果を判定できませんでした（status=\"${STATUS:-未設定}\"）
          ページ: ${PAGE_URL}
          run: ${RUN_URL}"
              ;;
          esac
          # 【Jev お試し期間だけ】選別結果（Step Summary の表）を見に行けるよう、実行画面へのリンクを足す。
          # お試し期間が終わったらこの if ブロックと上の JEV_* の env を消す（Issue で管理）
          if [ -n "${JEV_STATUS:-}" ] && [ "$JEV_STATUS" != "disabled" ]; then
            TEXT="${TEXT}
          🧭 Jev 判定 ${JEV_SCORED} / 失敗 ${JEV_FAILED}（お試し中）: ${RUN_URL}"
          fi
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d @-

  # --- ③ build / deploy のいずれかが失敗したら Slack 通知 ---
  notify-failure:
    needs: [build, deploy]
    if: failure() # いずれかの needs が失敗したときのみ実行
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack (failure)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          STATUS: ${{ needs.build.outputs.status }}
          REASON: ${{ needs.build.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$BUILD_RESULT" != "success" ]; then
            FAILED_JOB="build（ニュース取得・HTML生成）"
          elif [ "$DEPLOY_RESULT" != "success" ]; then
            FAILED_JOB="deploy（GitHub Pages へのデプロイ）"
          else
            FAILED_JOB="不明"
          fi
          DETAIL="build=${BUILD_RESULT} / deploy=${DEPLOY_RESULT}"
          if [ -n "${REASON:-}" ]; then
            DETAIL="${DETAIL} / サマリ生成: ${STATUS} (${REASON})"
          fi
          TEXT="❌ 朝のニュースダイジェストの生成に失敗しました
          失敗したジョブ: ${FAILED_JOB}
          判定: ${DETAIL}
          run: ${RUN_URL}"
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d @-
